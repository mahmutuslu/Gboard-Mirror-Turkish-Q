name: Build modern libxposed API 102 RC3 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK and install platform
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build modern RC3 APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify modern module metadata and APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx 'META-INF/xposed/java_init.list'
          unzip -Z1 "$APK" | grep -Fx 'META-INF/xposed/module.prop'
          unzip -Z1 "$APK" | grep -Fx 'META-INF/xposed/scope.list'
          unzip -p "$APK" META-INF/xposed/java_init.list
          unzip -p "$APK" META-INF/xposed/module.prop
          unzip -p "$APK" META-INF/xposed/scope.list
          sha256sum "$APK"
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Gboard-Mirror-Turkish-Q-Modern-API102-RC3
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish RC3 pre-release after successful build
        if: github.repository == 'mahmutuslu/Gboard-Mirror-Turkish-Q' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-modern-api102-rc3
          name: Gboard Mirror Turkish Q — Modern API 102 RC3 (test)
          prerelease: true
          make_latest: false
          body_path: RELEASE_NOTES_TR.md
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
