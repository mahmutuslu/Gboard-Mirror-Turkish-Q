name: Build modern libxposed API 102 RC1 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK and install platform
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build modern RC1 APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify built APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Gboard-Mirror-Turkish-Q-Modern-API102-RC1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish RC1 pre-release after successful build
        if: github.repository == 'mahmutuslu/Gboard-Mirror-Turkish-Q' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-modern-api102-rc1
          name: Gboard Mirror Turkish Q — Modern API 102 RC1 (test)
          prerelease: true
          make_latest: false
          body_path: RELEASE_NOTES_TR.md
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
