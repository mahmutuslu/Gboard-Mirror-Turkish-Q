name: Publish verified Modern API 102 v1.0.0 Final

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4
      - name: Verify final implementation is exactly RC8
        run: |
          git diff --exit-code 9d1755b0056ad58ba9e82cbc0b318cdb2b8931ba HEAD -- \
            app/src/main/java \
            app/build.gradle.kts \
            app/src/main/resources \
            app/src/main/AndroidManifest.xml \
            app/src/main/res
      - name: Download and verify the exact device-tested RC8 APK
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/mahmutuslu/Gboard-Mirror-Turkish-Q/releases/download/v1.0.0-modern-api102-rc8/app-debug.apk"
          APK="Gboard-Mirror-Turkish-Q-v1.0.0-Final.apk"
          curl --fail --location --retry 3 --silent --show-error "$URL" -o "$APK"
          echo "fc909f0f4842ed16e87118db4175067ffbff639ce2936fc5d3a52607bbb2a280  $APK" | sha256sum --check
          unzip -Z1 "$APK" | grep -Fx 'META-INF/xposed/java_init.list'
          unzip -Z1 "$APK" | grep -Fx 'META-INF/xposed/module.prop'
          unzip -Z1 "$APK" | grep -Fx 'META-INF/xposed/scope.list'
          echo "Releasing byte-identical tested RC8 artifact as stable v1.0.0"
      - name: Attach verified APK to v1.0.0 stable release
        if: github.repository == 'mahmutuslu/Gboard-Mirror-Turkish-Q' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: main
          name: Gboard Mirror Turkish Q — Modern API 102 v1.0.0 Final
          prerelease: false
          make_latest: true
          body_path: RELEASE_NOTES_TR.md
          files: Gboard-Mirror-Turkish-Q-v1.0.0-Final.apk
          fail_on_unmatched_files: true
